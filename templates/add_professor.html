<!DOCTYPE html>
<html>
<head>
<title>Add Professor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow">

<div class="card-header bg-dark text-white text-center">
<h5>Saraswati College of Engineering</h5>
<small>Department of Artificial Intelligence & Machine Learning</small>
</div>

<div class="card-body">

<h4 class="text-center mb-3">Add Professor</h4>

<form method="POST">

<div class="mb-3">
<label class="form-label">Professor Name</label>
<input type="text" name="username" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" name="password" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Department</label>
<input type="text" name="department" class="form-control" placeholder="AIML / IT / CS" required>
</div>

<div class="d-grid">
<button type="submit" class="btn btn-success">
Add Professor
</button>
</div>

</form>

<hr>

<a href="/admin" class="btn btn-secondary w-100">
Back to Dashboard
</a>

</div>
</div>

</div>
</div>

</div>

</body>
</html>
