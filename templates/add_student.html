<!DOCTYPE html>
<html>
<head>
<title>Add Student</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow">

<div class="card-header bg-dark text-white text-center">
<h5>Saraswati College of Engineering</h5>
<small>Department of Artificial Intelligence & Machine Learning</small>
</div>

<div class="card-body">

<h4 class="text-center mb-3">Add Student</h4>

<form method="POST">

<div class="mb-3">
<label>Student ID</label>
<input type="text" name="student_id" class="form-control" required>
</div>

<div class="mb-3">
<label>Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="mb-3">
<label>Division</label>
<input type="text" name="division" class="form-control" required>
</div>

<button class="btn btn-success">Add Student</button>
<a href="/admin" class="btn btn-secondary">Back</a>

</form>

</body>
</html>
