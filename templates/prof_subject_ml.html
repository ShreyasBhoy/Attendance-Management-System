
<!DOCTYPE html>
<html>
<head>
<title>Professor AI Performance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.safe{color:green;font-weight:bold;}
.risk{color:red;font-weight:bold;}
</style>

</head>

<body class="bg-light">

<div class="container mt-4">

<h3 class="mb-3">Subject AI Performance</h3>

<a href="/professor" class="btn btn-dark mb-3">← Back</a>

<div class="card shadow">
<div class="card-body">

<table class="table table-bordered table-striped table-hover text-center">
<thead class="table-dark">
<tr>
<th>Student</th>
<th>Current %</th>
<th>Needed</th>
<th>Remaining</th>
<th>ML Status</th>
<th>Achievable</th>
</tr>
</thead>

<tbody>
{% for s in data %}
<tr>
<td class="text-start">{{ s.student }}</td>
<td>{{ s.current_percent }}%</td>
<td>{{ s.needed }}</td>
<td>{{ s.remaining }}</td>
<td class="{{ 'safe' if s.status=='Safe' else 'risk' }}">
{{ s.status }}
</td>
<td>{{ s.achievable }}</td>
</tr>
{% endfor %}
</tbody>

</table>

</div>
</div>

</div>

</body>
</html>
