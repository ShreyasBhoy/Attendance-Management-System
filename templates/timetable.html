<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="text-center mt-4">
    <h2>Second Year - Div A Timetable</h2>
    <h5 class="text-muted">Department of Artificial Intelligence and Machine Learning</h5>
</div>

<div class="container mt-3">
<table class="table table-bordered table-hover table-striped text-center shadow">
<thead class="table-success">
<tr>
<th>Day</th>
<th>Time</th>
<th>Subject</th>
<th>Class</th>
</tr>
</thead>

<tbody>
{% for t in data %}
<tr>
<td>{{ t.day }}</td>
<td>{{ t.time }}</td>
<td>{{ t.subject_code }}</td>
<td>{{ t.class_name }}</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
