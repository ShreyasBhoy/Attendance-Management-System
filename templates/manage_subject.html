<!DOCTYPE html>
<html>
<head>
<title>Manage Subject</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

<div class="text-center mb-4">
    <h4 class="fw-bold">Saraswati College of Engineering</h4>
    <h6 class="text-muted">Department of Artificial Intelligence & Machine Learning</h6>
    <hr>
</div>

<h3 class="mb-4">Manage Subject</h3>

<div class="row">

<!-- ADD SUBJECT -->
<div class="col-md-6">
<div class="card shadow">
<div class="card-header bg-dark text-white">
Add Subject
</div>
<div class="card-body">

<form method="POST">
<input type="hidden" name="action" value="add">

<div class="mb-2">
<label>Code</label>
<input type="text" name="code" class="form-control" required>
</div>

<div class="mb-2">
<label>Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="mb-2">
<label>Type</label>
<select name="type" class="form-control">
<option>Theory</option>
<option>Lab</option>
</select>
</div>

<button class="btn btn-success w-100">
Add Subject
</button>

</form>

</div>
</div>
</div>

<!-- ASSIGN SUBJECT -->
<div class="col-md-6">
<div class="card shadow">
<div class="card-header bg-primary text-white">
Assign Subject
</div>
<div class="card-body">

<form method="POST">
<input type="hidden" name="action" value="assign">

<div class="mb-2">
<label>Professor</label>
<select name="professor" class="form-control">
{% for p in professors %}
<option value="{{p.username}}">
{{p.username}}
</option>
{% endfor %}
</select>
</div>

<div class="mb-2">
<label>Subject</label>
<select name="subject_code" class="form-control">
{% for s in subjects %}
<option value="{{s.subject_code}}">
{{s.subject_name}}
</option>
{% endfor %}
</select>
</div>

<button class="btn btn-primary w-100">
Assign
</button>

</form>

</div>
</div>
</div>

</div>

<hr class="my-4">

<h5>Assignments</h5>

<table class="table table-bordered">

<thead class="table-dark">
<tr>
<th>Professor</th>
<th>Subject</th>
</tr>
</thead>

<tbody>
{% for a in assignments %}
<tr>
<td>{{a.professor}}</td>
<td>{{a.subject_code}}</td>
</tr>
{% endfor %}
</tbody>

</table>

<a href="/admin" class="btn btn-secondary">
Back
</a>

</div>

</body>
</html>
